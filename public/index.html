<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta name="description" content="Crypto Blackjack - Play with MATIC on Polygon">
  <title>Blackjack Crypto</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="/imgs/chips/Casino_Chip_Red.svg">
</head>
<body>

  <!-- ========== WALLET BAR ========== -->
  <div class="wallet-bar">
    <span class="wallet-title">Blackjack Crypto</span>
    <div class="mode-switcher">
      <button id="mode-solo" class="mode-btn active">Solo</button>
      <button id="mode-multi" class="mode-btn">Multiplayer</button>
    </div>
    <div class="wallet-bar-right">
      <div id="free-play-badge" class="free-play-badge">
        <span class="wallet-dot"></span> Free Play
      </div>
      <div id="wallet-status" class="hidden">
        <button id="connect-wallet" class="wallet-btn connect-btn">Connect Wallet</button>
      </div>
      <div id="wallet-info" class="hidden">
        <div class="wallet-address-badge">
          <span class="wallet-dot"></span>
          <span id="wallet-address"></span>
        </div>
        <button id="disconnect-wallet" class="wallet-btn" style="background:#1f2937;color:#9ca3af;border:1px solid #374151;">Disconnect</button>
      </div>
    </div>
  </div>

  <!-- ========== MENU SCREEN ========== -->
  <div id="menu-screen">
    <h1 class="menu-title">BLACKJACK</h1>
    <p class="menu-subtitle">Crypto Casino</p>

    <div class="menu-card">
      <div class="menu-label">Choose your avatar</div>
      <div id="avatar-box">
        <button id="avatar-prev" class="avatar-nav"><i class="fas fa-chevron-left"></i></button>
        <div class="avatar-item hidden"><img src="/imgs/avatars/user.svg" alt="user"></div>
        <div class="avatar-item hidden"><img src="/imgs/avatars/mafia.svg" alt="mafia"></div>
        <div class="avatar-item hidden"><img src="/imgs/avatars/casino.svg" alt="casino"></div>
        <div class="avatar-item hidden"><img src="/imgs/avatars/baby.svg" alt="baby"></div>
        <div class="avatar-item hidden"><img src="/imgs/avatars/terrorist.svg" alt="terrorist"></div>
        <div class="avatar-item hidden"><img src="/imgs/avatars/detective.svg" alt="detective"></div>
        <div class="avatar-item hidden"><img src="/imgs/avatars/work-out.svg" alt="work-out"></div>
        <div class="avatar-item hidden"><img src="/imgs/avatars/manager.svg" alt="manager"></div>
        <button id="avatar-next" class="avatar-nav"><i class="fas fa-chevron-right"></i></button>
      </div>

      <input id="nickname" type="text" placeholder="Enter your nickname" maxlength="12" autocomplete="off">

      <button id="btn-play" class="play-btn btn-solo">
        <i class="fas fa-robot"></i> Play Solo
      </button>
      <button id="btn-create" class="play-btn btn-multi hidden">
        <i class="fas fa-users"></i> Create Room
      </button>
      <button id="btn-join" class="play-btn btn-multi hidden">
        <i class="fas fa-user-plus"></i> Join Room
      </button>
    </div>
  </div>

  <!-- ========== GAME SCREEN ========== -->
  <div id="game-screen" class="hidden">

    <div class="table-felt">
      <div class="table-border"></div>

      <!-- Dealer -->
      <div class="dealer-area">
        <div class="area-label">Dealer</div>
        <div id="dealer-score" class="score-badge hidden"></div>
        <div id="dealer-cards" class="cards-row"></div>
      </div>

      <!-- Player -->
      <div class="player-area">
        <div id="player-score" class="score-badge hidden"></div>
        <div id="player-cards" class="cards-row"></div>
      </div>
    </div>

    <!-- Info Bar -->
    <div class="info-bar">
      <div class="info-item">
        <div class="info-label">Balance</div>
        <div id="balance" class="info-value gold">5000</div>
      </div>
      <div class="info-item">
        <div class="info-label">Total Bet</div>
        <div id="total-bet" class="info-value">0</div>
      </div>
    </div>

    <!-- Chips -->
    <div id="chip-tray" class="chip-tray">
      <div class="chip chip-10" data-value="10">10</div>
      <div class="chip chip-50" data-value="50">50</div>
      <div class="chip chip-100" data-value="100">100</div>
      <div class="chip chip-500" data-value="500">500</div>
      <div class="chip chip-1k" data-value="1000">1K</div>
      <div class="chip chip-5k" data-value="5000">5K</div>
      <div class="chip chip-10k" data-value="10000">10K</div>
      <div class="chip chip-50k" data-value="50000">50K</div>
      <div class="chip chip-100k" data-value="100000">100K</div>
    </div>

    <!-- Bet Controls -->
    <div class="bet-controls">
      <button id="btn-clear" class="bet-ctrl-btn">Clear</button>
      <button id="btn-deal" class="btn-deal hidden">Deal</button>
      <button id="btn-max" class="bet-ctrl-btn">Max</button>
    </div>

    <!-- Action Buttons -->
    <div id="action-btns" class="action-bar hidden">
      <button id="btn-stand" class="action-btn btn-stand">
        <i class="fas fa-hand"></i>
        <span>Stand</span>
      </button>
      <button id="btn-hit" class="action-btn btn-hit">
        <i class="fas fa-hand-pointer"></i>
        <span>Hit</span>
      </button>
      <button id="btn-double" class="action-btn btn-double">
        <i class="fas fa-dice"></i>
        <span>2x</span>
      </button>
    </div>

    <!-- Result Overlay -->
    <div id="result-overlay" class="result-overlay hidden">
      <div class="result-box">
        <div id="result-text" class="result-text"></div>
        <div id="result-amount" class="result-amount"></div>
        <button id="btn-new-round" class="btn-new-round">New Round</button>
      </div>
    </div>

  </div>

  <!-- ========== SCRIPTS ========== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/solo.js"></script>
  <script src="/js/wallet.js"></script>

  <!-- Sounds -->
  <script>
    window.Sounds = {
      dealing: new Howl({ src: ['sounds/dealing_card_fix3.mp3'] }),
      chipHover: new Howl({ src: ['sounds/chip_hover_fix.mp3'] }),
      chipPlace: new Howl({ src: ['sounds/chip_place.mp3'] }),
      actionClick: new Howl({ src: ['sounds/actionClick.mp3'] }),
      defaultClick: new Howl({ src: ['sounds/click_default.mp3'] }),
      youWin: new Howl({ src: ['sounds/you_win.mp3'] }),
      youLose: new Howl({ src: ['sounds/you_lose.mp3'] }),
    };
  </script>

</body>
</html>
